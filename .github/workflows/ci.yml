name: CI

# COST GUARD, 2026-08-23. `build-ios` below runs on macos-latest, which bills at
# $0.062/min against ubuntu's $0.006 — 10.3x. This repo billed **$94.24 of macOS
# in July 2026** and has run once since; the shape below is what made that
# number, and it will make it again the next time the repo gets active.
#
# Two defects, both fixed here:
#   1. `push:` carried NO branch filter, so every push to every feature branch
#      built iOS on macOS — and because `pull_request:` also fired, an open PR
#      built it TWICE per push. `push` is now main-only; feature branches are
#      covered by the pull_request trigger.
#   2. No concurrency group, so three pushes in a row left three macOS builds
#      racing to completion instead of cancelling the two that no longer mattered.
#
# paths-ignore is safe here: this repo has no required status checks and no
# rulesets (verified 2026-08-23), so a skipped workflow cannot leave a PR stuck
# on a pending context — unlike fysigo-web, where that trap is real. Re-check
# before adding branch protection.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

# Never cancel on main: the post-merge run is the record of what landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Analyze
        run: |
          flutter analyze
          cd example && flutter analyze

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Build example APK (compile gate)
        run: cd example && flutter build apk --debug

  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Build example iOS (compile gate)
        run: cd example && flutter build ios --no-codesign
