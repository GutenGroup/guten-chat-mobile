name: backlog

# The backlog robot. BACKLOG.md is generated from the open issues labelled `backlog`
# (templates/render-backlog.mjs); this workflow re-renders it nightly and on every issue
# label change, and pushes when it changed. Never edit BACKLOG.md by hand.
on:
  schedule:
    - cron: "30 3 * * *"
  issues:
    types: [opened, labeled, unlabeled, closed, reopened, edited, assigned, unassigned]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render BACKLOG.md from Issues
        run: node scripts/render-backlog.mjs "${{ github.repository }}"

      - name: Commit and push if it changed
        run: |
          if git diff --quiet -- BACKLOG.md; then
            echo "UNCHANGED"
            exit 0
          fi
          git config user.name "backlog robot"
          git config user.email "backlog-robot@users.noreply.github.com"
          git add BACKLOG.md
          git commit -m "backlog: rendered from Issues"
          git push
